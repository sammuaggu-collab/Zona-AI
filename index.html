<!DOCTYPE html>
<html lang="en">

<head>
<title>Zona AI — AI Assistant</title>

<meta name="description" content="Zona AI is an AI assistant created by Ahathish Kumaran. Get help with studies, science projects, questions, and more.">

<meta name="keywords" content="Zona AI, Zono AI, Zona AI chatbot, AI assistant, AI student assistant">

<meta name="author" content="Ahathish Kumaran">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://zona-ai.onrender.com/">
    <meta name="google-site-verification"
        content="nmaujRqwP6x0mdyUWGh9pTk8FmMYk19YeOtEhkhxMyQ">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="Zono AI - Your AI assistant"
    >

    <title>Zono AI</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</>


<body>

    <div class="app">


        <!-- ==========================================
             SIDEBAR
        =========================================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-header">

                <div class="sidebar-brand">

                    <div class="z-logo">
                        Z
                    </div>

                    <span>
                        Zono AI
                    </span>

                </div>


                <button
                    class="close-button"
                    id="closeSidebar"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat-button"
                id="newChatButton"
                type="button"
            >

                <span class="plus">
                    ＋
                </span>

                <span>
                    New Chat
                </span>

            </button>


            <!-- CLEAR CHAT -->

            <button
                class="clear-chat-button"
                id="clearChatButton"
                type="button"
                aria-label="Clear current chat"
                title="Clear current chat"
            >

                <span>
                    🗑️
                </span>

                <span>
                    Clear Chat
                </span>

            </button>


            <!-- RECENT CHATS -->

            <div class="history-title">
                RECENT CHATS
            </div>


            <div
                class="chat-history"
                id="chatHistory"
            ></div>

        </aside>


        <!-- ==========================================
             SIDEBAR BACKDROP
        =========================================== -->

        <div
            class="sidebar-backdrop"
            id="sidebarBackdrop"
        ></div>


        <!-- ==========================================
             MAIN
        =========================================== -->

        <main class="main">


            <!-- ======================================
                 HEADER
            ======================================= -->

            <header class="header">


                <!-- MENU -->

                <button
                    class="header-button"
                    id="menuButton"
                    type="button"
                    aria-label="Open menu"
                    title="Open menu"
                >
                    ☰
                </button>


                <!-- BRAND -->

                <div class="header-brand">

                    <div class="mini-logo">
                        Z
                    </div>


                    <div>

                        <div class="brand-name">
                            Zono AI
                        </div>


                        <div class="online-status">

                            <span></span>

                            Online

                        </div>

                    </div>

                </div>


                <!-- IMAGE GENERATOR -->

                <button
                    class="header-button image-button"
                    id="imageButton"
                    type="button"
                    aria-label="Generate image"
                    title="Generate image"
                >
                    🎨
                </button>

            </header>


            <!-- ==========================================
                 CHAT AREA
            =========================================== -->

            <section
                class="chat-area"
                id="chatArea"
            >


                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        Z
                    </div>


                    <h1>
                        Welcome to Zono AI
                    </h1>


                    <p>
                        Your AI. Your world.
                    </p>

                </div>

            </section>


            <!-- ==========================================
                 COMPOSER
            =========================================== -->

            <footer class="composer">


                <!-- ATTACHMENT PREVIEW -->

                <div
                    class="attachment-preview"
                    id="attachmentPreview"
                ></div>


                <div class="composer-box">


                    <!-- ==================================
                         ATTACH FILE
                    =================================== -->

                    <button
                        class="attach-button"
                        id="attachButton"
                        type="button"
                        aria-label="Attach files"
                        title="Attach files"
                    >
                        ＋
                    </button>


                    <!-- ==================================
                         HIDDEN FILE INPUT
                    =================================== -->

                    <input
                        id="fileInput"
                        type="file"
                        hidden
                        multiple
                        accept="image/*,.pdf,.doc,.docx,.txt"
                    >


                    <!-- ==================================
                         MESSAGE INPUT
                    =================================== -->

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Message Zono..."
                        autocomplete="off"
                        autocorrect="on"
                        spellcheck="true"
                        enterkeyhint="send"
                    >


                    <!-- ==================================
                         VOICE
                    =================================== -->

                    <button
                        class="voice-button"
                        id="voiceButton"
                        type="button"
                        aria-label="Voice input"
                        title="Voice input"
                    >
                        🎙️
                    </button>


                    <!-- ==================================
                         SEND
                    =================================== -->

                    <button
                        class="send-button"
                        id="sendButton"
                        type="button"
                        aria-label="Send message"
                        title="Send message"
                    >
                        ➤
                    </button>

                </div>


                <!-- ==================================
                     DISCLAIMER
                =================================== -->

                <div class="composer-note">
                    Zono AI can make mistakes.
                    Check important information.
                </div>

            </footer>

        </main>

    </div>


    <!-- ==========================================
         ZONO JAVASCRIPT
    =========================================== -->

    <script src="./script.js"></script>


</body>

</html>
