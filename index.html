<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <meta
        name="description"
        content="Zono AI - Your AI assistant"
    >

    <title>Zono AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">

                <div class="sidebar-brand">

                    <div class="z-logo">Z</div>

                    <span>Zono AI</span>

                </div>

                <button
                    class="close-button"
                    id="closeSidebar"
                    type="button"
                >
                    ×
                </button>

            </div>

            <button
                class="new-chat-button"
                id="newChatButton"
                type="button"
            >
                <span class="plus">＋</span>
                <span>New Chat</span>
            </button>

            <div class="history-title">
                RECENT CHATS
            </div>

            <div
                class="chat-history"
                id="chatHistory"
            ></div>

        </aside>


        <!-- SIDEBAR BACKDROP -->

        <div
            class="sidebar-backdrop"
            id="sidebarBackdrop"
        ></div>


        <!-- MAIN -->

        <main class="main">

            <!-- HEADER -->

            <header class="header">

                <button
                    class="header-button"
                    id="menuButton"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>

                <div class="header-brand">

                    <div class="mini-logo">
                        Z
                    </div>

                    <div>

                        <div class="brand-name">
                            Zono AI
                        </div>

                        <div class="online-status">
                            <span></span>
                            Online
                        </div>

                    </div>

                </div>

                <!-- No top-right plus button -->

                <div class="header-spacer"></div>

            </header>


            <!-- CHAT AREA -->

            <section
                class="chat-area"
                id="chatArea"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        Z
                    </div>

                    <h1>
                        Welcome to Zono AI
                    </h1>

                    <p>
                        Your AI. Your world.
                    </p>

                </div>

            </section>


            <!-- MESSAGE COMPOSER -->

            <footer class="composer">

                <!-- ATTACHMENT PREVIEW -->

                <div
                    class="attachment-preview"
                    id="attachmentPreview"
                ></div>


                <div class="composer-box">

                    <!-- PLUS / FILE UPLOAD -->

                    <button
                        class="attach-button"
                        id="attachButton"
                        type="button"
                        aria-label="Attach file"
                        title="Attach file"
                    >
                        ＋
                    </button>


                    <!-- HIDDEN FILE PICKER -->

                    <input
                        id="fileInput"
                        type="file"
                        hidden
                        multiple
                        accept="image/*,.pdf,.doc,.docx,.txt"
                    >


                    <!-- MESSAGE INPUT -->

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Message Zono..."
                        autocomplete="off"
                        autocorrect="on"
                        spellcheck="true"
                        enterkeyhint="send"
                    >


                    <!-- VOICE -->

                    <button
                        class="voice-button"
                        id="voiceButton"
                        type="button"
                        aria-label="Voice input"
                        title="Voice input"
                    >
                        🎙️
                    </button>


                    <!-- SEND -->

                    <button
                        class="send-button"
                        id="sendButton"
                        type="button"
                        aria-label="Send message"
                        title="Send message"
                    >
                        ➤
                    </button>

                </div>


                <div class="composer-note">
                    Zono AI can make mistakes. Check important information.
                </div>

            </footer>

        </main>

    </div>


    <!-- JAVASCRIPT -->

    <script src="./script.js?v=3"></script>

</body>

</html>
